---
name: PR Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  ci-cd:
    uses: miikkak/workflows/.github/workflows/ci-cd.yml@20519da379d48fa8a499b4c7b1753a09886fbfb7 # main
    with:
      code-paths: >-
        '**/*.java', '**/*.kts', 'gradle.properties', 'gradle/wrapper/**',
        '.github/workflows/**', '.pre-commit-config.yaml'
