repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^gradlew\.bat$
      - id: check-yaml
      - id: check-json

  # Secret detection with gitleaks. The commit-stage hook scans staged changes
  # (skippable with --no-verify); the pre-push stage re-scans the commits being
  # pushed. CI (secret-scan.yml) is the non-bypassable backstop.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      # Covers the first ref of a multi-ref push only (pre-commit exposes a
      # single from/to pair); the CI push scan covers every ref.
      - id: gitleaks
        alias: gitleaks-push
        name: Detect hardcoded secrets (pushed commits)
        entry: >-
          bash -c 'gitleaks git --redact --no-banner --verbose
          --log-opts="--diff-merges=first-parent ${PRE_COMMIT_FROM_REF:+${PRE_COMMIT_FROM_REF}..}${PRE_COMMIT_TO_REF}"'
        stages: [pre-push]
        # Scan even when the pushed range's net diff touches no files: a
        # secret added then deleted within the range is still in history.
        always_run: true
